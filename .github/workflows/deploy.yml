name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Separate queue per branch/PR, so a PR run can never cancel a live deploy.
  # PRs: cancel superseded runs. main: never cancel an in-progress deploy.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write: main saves newly built old versions to the `versions` branch
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the home page can find the latest-updated project
          # from git commit dates (a shallow clone gives every file the same date).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      # Version history: a frozen copy of the site per merged PR, at /versions/pr-<N>/.
      # Builds are kept on the `versions` branch, so each PR is only built once.
      # PR runs build and assemble too (so they test it) but only main saves.
      # RELEASE: on PR runs HEAD is GitHub's test merge, so main's tip is HEAD^1.
      - name: Check out saved versions
        run: |
          if git ls-remote --exit-code --heads origin versions > /dev/null; then
            git fetch --quiet origin versions
            git worktree add --detach .versions-store origin/versions
          else
            git worktree add --orphan -b versions .versions-store
          fi

      - name: Build new versions
        env:
          RELEASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
        run: node scripts/versions.mjs build --store .versions-store --release "$RELEASE"

      - name: Save new versions
        if: github.event_name != 'pull_request'
        working-directory: .versions-store
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -m "Versions as of ${GITHUB_SHA::7}"
            git push --quiet origin HEAD:refs/heads/versions
          fi

      - name: Add versions to site
        env:
          RELEASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
        run: node scripts/versions.mjs assemble --store .versions-store --release "$RELEASE"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5